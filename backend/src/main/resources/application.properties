spring.application.name=data-governance
spring.datasource.url=${GOVERNANCE_DB_URL}
spring.datasource.username=${GOVERNANCE_DB_USER}
spring.datasource.password=${GOVERNANCE_DB_PASSWORD}
spring.flyway.fail-on-missing-locations=true
spring.flyway.locations=classpath:db/mysql

governance.credential-key=${GOVERNANCE_CREDENTIAL_KEY}
governance.driver-dir=${GOVERNANCE_DRIVER_DIR:./drivers}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB
server.servlet.session.timeout=${GOVERNANCE_SESSION_TIMEOUT:30m}
